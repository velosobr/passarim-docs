# docker-compose.yml — sobe toda a infraestrutura local do Passarim.
# Uso: cp .env.example .env && docker compose up -d --wait
#
# Duas redes separam quem pode falar com quem (defesa em profundidade):
#   - passarim-public:  Traefik <-> BFF
#   - passarim-private: BFF <-> catalog <-> banco/cache/storage
# O Traefik NÃO está na rede privada e não tem acesso ao socket do Docker
# (só a um proxy que permite listar containers): mesmo comprometido, não
# alcança o banco. Prometheus e Jaeger estão nas duas redes porque precisam
# coletar dados dos dois lados.
#
# Todas as portas são publicadas apenas em 127.0.0.1 (só o seu computador
# acessa; ninguém na sua rede Wi-Fi).

name: passarim

networks:
  passarim-public:
    name: passarim-public
  # Rede exclusiva entre o Traefik e o socket proxy.
  passarim-docker-api:
    name: passarim-docker-api
    internal: true   # sem acesso à internet
  passarim-private:
    name: passarim-private

volumes:
  postgres-data:
  objectstorage-data:
  grafana-data:

services:
  # Banco relacional — dono: passarim-catalog (ADR-0004).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${HOST_PORT_POSTGRES}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [passarim-private]
    healthcheck:
      # pg_isready responde OK quando o banco aceita conexões.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache do BFF (etapa 3).
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:${HOST_PORT_REDIS}:6379"]
    networks: [passarim-private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage compatível com S3 para fotos e áudios (ADR-0006).
  # Localmente usamos o SeaweedFS (ADR-0012); em produção, o Cloudflare R2.
  # Como os dois falam o protocolo S3, o código Go é o mesmo nos dois casos.
  objectstorage:
    image: chrislusf/seaweedfs:4.48
    # "server -s3" sobe, num único processo, o armazenamento e a API S3 (porta 8333).
    command: server -s3 -dir=/data
    environment:
      # Com estas variáveis o SeaweedFS exige credenciais: acesso anônimo recebe 403.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${HOST_PORT_S3}:8333"     # API S3
      - "127.0.0.1:${HOST_PORT_S3_UI}:8888"  # navegador de arquivos (filer)
    volumes: [objectstorage-data:/data]
    networks: [passarim-private]
    healthcheck:
      # 127.0.0.1 e não "localhost": no container, localhost resolve primeiro
      # para IPv6 (::1), mas o SeaweedFS só escuta em IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Load balancer na frente das réplicas do BFF (etapa 3 adiciona as réplicas).
  traefik:
    image: traefik:v3.5
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "127.0.0.1:${HOST_PORT_TRAEFIK_HTTP}:80"
      - "127.0.0.1:${HOST_PORT_TRAEFIK_DASHBOARD}:8081"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks: [passarim-public, passarim-docker-api]
    depends_on: [docker-socket-proxy]
    healthcheck:
      # Passamos o mesmo arquivo de config para o healthcheck achar o /ping na 8081.
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Socket proxy: o Traefik descobre containers pela API do Docker. Montar
  # /var/run/docker.sock direto nele seria perigoso: o ":ro" NÃO limita a API,
  # e quem tem o socket consegue criar containers privilegiados (= root no host).
  # Este proxy só libera leitura da lista de containers; o resto responde 403.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1   # permite GET /containers (o que o Traefik precisa)
      POST: 0         # bloqueia qualquer escrita (criar, apagar, exec...)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [passarim-docker-api]

  # Catalog API (gRPC). Só na rede PRIVADA: ninguém de fora chega nele,
  # nem publicamos porta no host. Quem o consome é o BFF (Etapa 3).
  # "build" aponta para o repositório vizinho; na Etapa 4 isso vira uma
  # imagem publicada no GHCR.
  catalog-api:
    build: ../passarim-catalog
    image: passarim-catalog:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      GRPC_REFLECTION: "true"   # só em dev: permite usar o grpcurl
    depends_on:
      postgres:
        condition: service_healthy
    networks: [passarim-private]
    read_only: true             # sistema de arquivos só de leitura (OWASP API8)
    healthcheck:
      test: ["CMD", "/usr/local/bin/catalog-api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Roda UMA vez para carregar as aves curadas e termina.
  catalog-seed:
    image: passarim-catalog:dev
    pull_policy: never   # imagem construída localmente pelo serviço catalog-api; não existe em registry
    entrypoint: ["/usr/local/bin/seed", "-dir", "/content/species"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      catalog-api:
        condition: service_healthy   # a API já aplicou as migrations
    networks: [passarim-private]
    read_only: true
    restart: "no"

  # Worker de ingestão (Etapa 2b): busca fotos, cantos e avistamentos nas
  # fontes externas e grava no banco e no object storage. Precisa de
  # INTERNET (sai pela rede privada, que não é "internal") e não recebe
  # conexões de ninguém, então não publica portas.
  catalog-worker:
    build:
      context: ../passarim-catalog
      dockerfile: Dockerfile.worker
    image: passarim-worker:dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      S3_ENDPOINT: objectstorage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      XENO_CANTO_API_KEY: ${XENO_CANTO_API_KEY:?defina XENO_CANTO_API_KEY no .env}
    depends_on:
      catalog-seed:
        condition: service_completed_successfully   # só começa com as aves já no banco
      objectstorage:
        condition: service_healthy
    networks: [passarim-private]
    read_only: true
    tmpfs: [/tmp]   # o ffmpeg pode precisar de arquivos temporários
    # O worker termina o lote em andamento (até 2 min) antes de sair; sem isto o
    # Docker o mata após 10 s e o job fica 'running' até voltar à fila (15 min).
    stop_grace_period: 2m30s

  # Coleta de métricas.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${HOST_PORT_PROMETHEUS}:9090"]
    # Precisa das duas redes: raspa o Traefik (pública) e, depois, o catalog (privada).
    networks: [passarim-public, passarim-private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Painéis de observabilidade.
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:${HOST_PORT_GRAFANA}:3000"]
    networks: [passarim-private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tracing distribuído: recebe spans via OpenTelemetry (OTLP) na porta 4317.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports: ["127.0.0.1:${HOST_PORT_JAEGER_UI}:16686"]
    networks: [passarim-public, passarim-private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 10
