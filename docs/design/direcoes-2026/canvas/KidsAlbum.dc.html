<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu álbum de aves</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF7E8; color: #1D2B3A; font-family: Nunito, sans-serif">
  <div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-size: 34px; line-height: 1.05; font-weight: 700">Meu álbum</h1>
      <div style="font-size: 15px; font-weight: 700">Cada ave que você guarda vira uma figurinha.</div>
    </div>

    <div style="border-radius: 26px; padding: 14px 16px; background: #FFFFFF; box-shadow: 0 4px 0 #F2E3C6; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-family: Fredoka, sans-serif; font-size: 18px; font-weight: 700">Mundo Pantanal</div>
        <div style="font-size: 14px; font-weight: 800; color: #1E5FA6">4 de 9</div>
      </div>
      <div style="height: 16px; border-radius: 8px; background: #D7F2FF; overflow: hidden" role="img" aria-label="4 de 9 figurinhas do Pantanal">
        <div style="width: 44%; height: 16px; border-radius: 8px; background: linear-gradient(90deg, #7DD3FC, #2B7FD8)"></div>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 3px solid #1D2B3A; background: #7DD3FC; font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; color: #1D2B3A">Pantanal</button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; color: #1D2B3A">Cerrado</button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #FFFFFF; font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; color: #1D2B3A">Amazônia</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stickers}}" as="s" hint-placeholder-count="9">
        <sc-if value="{{s.found}}" hint-placeholder-val="{{ true }}">
          <a href="KidsDetalhe.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #1D2B3A">
            <span style="width: 100px; height: 100px; position: relative; display: block">
              <svg width="100" height="100" viewBox="0 0 100 100" style="position: absolute; inset: 0" aria-hidden="true"><path d="M50 4 C58 4 62 12 70 13 C78 14 84 9 90 16 C96 23 90 30 92 38 C94 46 100 50 98 58 C96 66 88 68 85 76 C82 84 84 92 76 96 C68 100 62 93 54 94 C46 95 40 100 32 97 C24 94 23 86 17 80 C11 74 3 72 2 63 C1 54 8 50 8 42 C8 34 2 28 7 20 C12 12 20 14 28 10 C36 6 42 4 50 4 Z" fill="{{s.color}}" stroke="#FFFFFF" stroke-width="4"></path></svg>
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 23px; top: 23px" aria-hidden="true"><path d="M5 15c0-4.4 3.1-8 7-8 2.2 0 3.8 1.1 4.8 2.6L20 10.5l-3.1 1.3c-.2 4.3-3.3 7.2-7.2 7.2H7"></path><path d="M10 19l-1 3M13 19l1 3"></path></svg>
            </span>
            <span style="font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; text-align: center; line-height: 1.1">{{s.name}}</span>
          </a>
        </sc-if>
        <sc-if value="{{s.missing}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="width: 92px; height: 92px; margin: 4px; border-radius: 30px; border: 3px dashed #C9B48A; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-size: 34px; font-weight: 700; color: #B39867">?</span>
            <span style="font-size: 13px; font-weight: 700; color: #6B5A3A">Ainda falta</span>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 76px; border-radius: 38px; background: #1D2B3A; display: flex; align-items: center; justify-content: space-around; padding: 0 10px">
    <a href="KidsExplorar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 72px; height: 56px; color: #FFF7E8; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF7E8" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Explorar</a>
    <a href="KidsAlbum.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 18px; border-radius: 28px; background: #FFC93C; color: #1D2B3A; text-decoration: none; font-family: Fredoka, sans-serif; font-size: 17px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2B3A" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 3v18"></path></svg>Álbum</a>
    <a href="KidsExplorar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 72px; height: 56px; color: #FFF7E8; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF7E8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg>Ajustes</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Tuiuiú', color: '#2B7FD8' },
      { name: 'Arara-azul', color: '#1E5FA6' },
      { name: 'Socó-boi', color: '#3B95D6' },
      { name: 'Biguá', color: '#2470BF' },
      null, null, null, null, null,
    ];
    const stickers = list.map((s) => (s ? { found: true, missing: false, name: s.name, color: s.color } : { found: false, missing: true }));
    return { stickers };
  }
}
</script>
</body>
</html>
