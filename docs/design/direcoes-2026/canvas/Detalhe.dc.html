<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Detalhe repensado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101410; color: #E0E4DC; font-family: Manrope, sans-serif">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 430px; background: linear-gradient(155deg, #3E9CB5 0%, #1E5F8C 40%, #6E3A0E 100%)">
    <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 95px; top: 70px" aria-hidden="true"><path d="M5 15c0-4.4 3.1-8 7-8 2.2 0 3.8 1.1 4.8 2.6L20 10.5l-3.1 1.3c-.2 4.3-3.3 7.2-7.2 7.2H7"></path><path d="M10 19l-1 3M13 19l1 3"></path><circle cx="15.2" cy="9.8" r=".6"></circle></svg>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 240px; background: linear-gradient(180deg, rgba(16,20,16,0) 0%, rgba(16,20,16,0.7) 55%, #101410 100%)"></div>
  </div>

  <div style="position: absolute; top: 48px; left: 16px; right: 16px; display: flex; justify-content: space-between">
    <button type="button" aria-label="Voltar" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(16,20,16,0.42); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    <button type="button" aria-label="Desfavoritar Arara-azul-grande" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(16,20,16,0.42); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#7DDB97" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.2 4.5 7 4.5c2.1 0 3.6 1.1 5 2.8 1.4-1.7 2.9-2.8 5-2.8 3.8 0 6.1 3.8 4.6 7.2C19.5 16.4 12 21 12 21z"></path></svg></button>
  </div>

  <div style="position: absolute; top: 300px; left: 0; right: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 8px; align-items: center">
        <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: #5E4200; color: #FFDEA3; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F0BF4C"></span>Vulnerável</span>
        <span style="font-size: 13px; color: #C0C9BF">Psittacidae · 100 cm</span>
      </div>
      <h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF">Arara-azul-grande</h1>
      <div style="font-size: 16px; font-style: italic; color: #C0C9BF">Anodorhynchus hyacinthinus</div>
    </div>

    <div style="display: flex; gap: 8px">
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 4px; border-radius: 18px; background: #1C211C; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: linear-gradient(135deg, #063D27, #3FA66B)"></span>Amazônia</span>
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 4px; border-radius: 18px; background: #1C211C; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: linear-gradient(135deg, #6E3A0E, #D9A13B)"></span>Cerrado</span>
      <span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 4px; border-radius: 18px; background: #1C211C; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: linear-gradient(135deg, #0E3A57, #3E9CB5)"></span>Pantanal</span>
    </div>

    <div style="border-radius: 28px; padding: 16px; background: linear-gradient(135deg, #1E3B2A 0%, #1C211C 60%); display: flex; align-items: center; gap: 16px">
      <button type="button" aria-label="Tocar o canto" style="flex: none; width: 64px; height: 64px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="64" height="64" viewBox="0 0 100 100" style="position: absolute; inset: 0" aria-hidden="true"><path d="M50 4 C58 4 62 12 70 13 C78 14 84 9 90 16 C96 23 90 30 92 38 C94 46 100 50 98 58 C96 66 88 68 85 76 C82 84 84 92 76 96 C68 100 62 93 54 94 C46 95 40 100 32 97 C24 94 23 86 17 80 C11 74 3 72 2 63 C1 54 8 50 8 42 C8 34 2 28 7 20 C12 12 20 14 28 10 C36 6 42 4 50 4 Z" fill="#7DDB97"></path></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#00391B" style="position: relative" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <div style="display: flex; align-items: center; gap: 3px; height: 32px">
          <sc-for list="{{bars}}" as="bar" hint-placeholder-count="28">
            <span style="{{bar.style}}"></span>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #C0C9BF"><span>0:12</span><span>Canto · xeno-canto</span><span>0:31</span></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="border-radius: 20px; padding: 14px; background: #1C211C"><div style="font-size: 22px; font-weight: 800; color: #FFFFFF">3</div><div style="font-size: 12px; color: #C0C9BF">biomas</div></div>
      <div style="border-radius: 20px; padding: 14px; background: #1C211C"><div style="font-size: 22px; font-weight: 800; color: #FFFFFF">10</div><div style="font-size: 12px; color: #C0C9BF">estados</div></div>
      <div style="border-radius: 20px; padding: 14px; background: #1C211C"><div style="font-size: 22px; font-weight: 800; color: #FFFFFF">4</div><div style="font-size: 12px; color: #C0C9BF">fotos</div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #FFFFFF">Sobre a ave</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #E0E4DC">A maior arara do mundo, com plumagem azul-cobalto e um anel amarelo ao redor dos olhos e na base do bico.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const heights = [10, 18, 26, 14, 30, 22, 12, 28, 20, 32, 16, 24, 30, 12, 20, 28, 14, 22, 18, 26, 10, 20, 14, 24, 18, 12, 16, 10];
    const played = 11;
    const bars = heights.map((h, i) => ({
      style: 'flex: 1; height: ' + h + 'px; border-radius: 2px; background: ' + (i < played ? '#7DDB97' : '#414942'),
    }));
    return { bars };
  }
}
</script>
</body>
</html>
