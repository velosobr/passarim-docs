# CI do passarim-docs: valida documentação, compose e segredos.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks precisa do histórico completo
      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md"
      - name: mermaid diagrams compile
        # O mermaid-cli usa um Chromium "headless" para desenhar os diagramas.
        # Os runners Ubuntu do GitHub bloqueiam o sandbox do Chromium; como o
        # runner é descartável e só renderiza nossos próprios diagramas,
        # desligar o sandbox AQUI é aceitável (nunca faça isso num servidor).
        run: npx -y @mermaid-js/mermaid-cli -p .github/puppeteer-config.json -i README.md -o /tmp/readme.md
      - name: docker compose config is valid
        run: |
          cp .env.example .env
          echo 'XENO_CANTO_API_KEY=chave-falsa-so-para-validar' >> .env   # o .env.example deixa a chave vazia
          docker compose config --quiet
      - name: gitleaks (segredos commitados)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
