# Prometheus "raspa" (scrape) métricas dos serviços de tempos em tempos.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8081"]
  - job_name: catalog
    static_configs:
      - targets: ["catalog-api:9091"]
  - job_name: worker
    static_configs:
      - targets: ["catalog-worker:9092"]
  - job_name: bff
    static_configs:
      - targets: ["bff-1:9091", "bff-2:9091"]
